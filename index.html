<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stage.tn — Offres de Stage & Assistant IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #07262c; color: #f4f8f8; line-height: 1.5; }
    header {
      background: #051c20;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; }
    .logo span { color: #16c784; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
    nav a, .btn-offres {
      color: #e6f1f2;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .btn-offres {
      background: #16c784;
      color: #051c20;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .container { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
    .hero {
      background: #0b353e;
      padding: 28px;
      border-radius: 14px;
      margin-bottom: 24px;
    }
    .hero h1 { font-size: 30px; margin-bottom: 10px; }
    .hero h1 span { color: #16c784; font-style: italic; }
    .search-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .search-bar input, .search-bar select {
      padding: 11px 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      color: #051c20;
    }
    .search-bar input { flex: 1; min-width: 220px; }
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }
    .card {
      background: #0b353e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .meta { font-size: 13px; color: #9ec5cc; margin-top: 4px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-primary { background: #16c784; color: #051c20; }
    .btn-secondary { background: #174c57; color: #fff; }

    /* Modal détail offre */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #092f37;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      max-width: 640px;
      width: 100%;
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal h2 { margin-bottom: 6px; color: #16c784; }
    .modal p, .modal li { margin-top: 10px; color: #e6f1f2; font-size: 14px; }
    .modal ul { padding-left: 20px; }

    /* Agent IA */
    .ai-fab {
      position: fixed; bottom: 20px; right: 20px;
      background: #16c784; color: #051c20; font-weight: bold;
      border: none; border-radius: 999px; padding: 13px 18px;
      cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.35); z-index: 999;
    }
    .ai-box {
      position: fixed; bottom: 76px; right: 20px; width: 340px; max-width: calc(100vw - 32px);
      background: #092f37; border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px; display: none; flex-direction: column; overflow: hidden; z-index: 999;
    }
    .ai-box.open { display: flex; }
    .ai-header { background: #051c20; padding: 12px 14px; font-weight: bold; display: flex; justify-content: space-between; }
    .ai-messages { padding: 12px; height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .msg { padding: 8px 11px; border-radius: 10px; max-width: 88%; }
    .msg.bot { background: #13424c; align-self: flex-start; }
    .msg.user { background: #16c784; color: #051c20; align-self: flex-end; font-weight: bold; }
    .ai-form { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
    .ai-form input { flex: 1; padding: 10px; border: none; background: #051c20; color: #fff; }
    .ai-form button { padding: 0 14px; border: none; background: #16c784; color: #051c20; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#">stage<span>.tn</span></a>
    <nav>
      <a href="#offres">Offres disponibles</a>
      <button class="btn-offres" onclick="ouvrirMesOffres()">Offres (<span id="compteur-offres">0</span>)</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Trouve ton stage en Tunisie & <span>décroche-le.</span></h1>
      <p class="meta">Clique sur une offre pour voir sa description complète, ou ajoute-la dans tes <strong>Offres</strong>.</p>
      <div class="search-bar">
        <input id="recherche" type="text" placeholder="Rechercher un poste, une ville, une compétence..." oninput="afficherOffres()" />
        <select id="filtre-categorie" onchange="afficherOffres()">
          <option value="Toutes">Toutes les catégories</option>
          <option value="Développement & Tech">Développement & Tech</option>
          <option value="Marketing & Digital">Marketing & Digital</option>
          <option value="Gestion & Finance">Gestion & Finance</option>
        </select>
      </div>
    </section>

    <section id="offres" class="offers-grid"></section>
  </main>

  <!-- Détails d'une offre -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="fermerModal(event)">
    <div class="modal" id="modal-contenu"></div>
  </div>

  <!-- Agent IA -->
  <button class="ai-fab" onclick="toggleAI()">Agent IA</button>
  <div id="ai-box" class="ai-box">
    <div class="ai-header">
      <span>Agent IA — stage.tn</span>
      <button onclick="toggleAI()" style="background:none;border:none;color:#fff;cursor:pointer;">✕</button>
    </div>
    <div id="ai-messages" class="ai-messages">
      <div class="msg bot">Bonjour ! Demande-moi un conseil pour choisir un stage, préparer ton CV ou filtrer les offres.</div>
    </div>
    <form class="ai-form" onsubmit="envoyerMessageAI(event)">
      <input id="ai-input" type="text" placeholder="Écris ta question..." required />
      <button type="submit">OK</button>
    </form>
  </div>

  <script>
    const offres = [
      {
        id: 1,
        titre: "Stagiaire Développement Web",
        entreprise: "Tech Innov",
        ville: "Tunis",
        duree: "3 mois • Stage PFE",
        categorie: "Développement & Tech",
        resume: "Participez à la conception d'interfaces web et à l'intégration de fonctionnalités clients.",
        description: "Vous rejoindrez l'équipe produit pour développer des pages web responsives, corriger des anomalies d'affichage et collaborer avec les développeurs sur des projets concrets.",
        missions: ["Développer et maintenir des composants web", "Tester l'affichage sur mobile et ordinateur", "Participer aux revues de code et réunions d'équipe"],
        competences: ["HTML / CSS / JavaScript", "Bases de Git", "Esprit d'analyse et autonomie"]
      },
      {
        id: 2,
        titre: "Stage Marketing Digital & Social Media",
        entreprise: "Dar Digital",
        ville: "Sousse",
        duree: "4 mois • Stage d'été",
        categorie: "Marketing & Digital",
        resume: "Créez des contenus et suivez les performances des campagnes sur les réseaux sociaux.",
        description: "Vous accompagnerez l'équipe marketing dans la planification éditoriale, la création de visuels/textes adaptés à chaque réseau et l'analyse des statistiques d'engagement.",
        missions: ["Préparer le calendrier éditorial", "Suivre les statistiques des publications", "Proposer des idées de campagnes créatives"],
        competences: ["Réseaux sociaux", "Sens de la communication", "Rigueur et organisation"]
      },
      {
        id: 3,
        titre: "Stage Analyse de Données & Reporting",
        entreprise: "Sfax Data Solutions",
        ville: "Sfax",
        duree: "3 mois • Stage PFE",
        categorie: "Gestion & Finance",
        resume: "Nettoyez des données, créez des tableaux de bord et rédigez des synthèses d'aide à la décision.",
        description: "Vous travaillerez sur l'organisation de données métiers, la création de rapports clairs et l'automatisation de suivis réguliers pour les équipes opérationnelles.",
        missions: ["Structurer et vérifier des tableaux de données", "Construire des indicateurs de suivi", "Présenter des synthèses claires"],
        competences: ["Excel / Tableurs", "Logique et rigueur", "Capacité de synthèse"]
      }
    ];

    let mesOffresIds = JSON.parse(localStorage.getItem("stage_tn_mes_offres") || "[]");

    function sauvegarderOffres() {
      localStorage.setItem("stage_tn_mes_offres", JSON.stringify(mesOffresIds));
      document.getElementById("compteur-offres").textContent = mesOffresIds.length;
    }

    function toggleOffre(id) {
      if (mesOffresIds.includes(id)) {
        mesOffresIds = mesOffresIds.filter(x => x !== id);
      } else {
        mesOffresIds.push(id);
      }
      sauvegarderOffres();
      afficherOffres();
    }

    function afficherOffres() {
      const q = document.getElementById("recherche").value.toLowerCase().trim();
      const cat = document.getElementById("filtre-categorie").value;
      const zone = document.getElementById("offres");

      const filtrées = offres.filter(o => {
        const matchCat = cat === "Toutes" || o.categorie === cat;
        const texte = `${o.titre} ${o.entreprise} ${o.ville} ${o.resume} ${o.description}`.toLowerCase();
        return matchCat && (!q || texte.includes(q));
      });

      zone.innerHTML = filtrées.map(o => {
        const ajoutee = mesOffresIds.includes(o.id);
        return `
          <article class="card">
            <div>
              <h2 style="cursor:pointer;" onclick="ouvrirDetail(${o.id})">${o.titre}</h2>
              <div class="meta">${o.entreprise} — ${o.ville} • ${o.duree}</div>
              <p style="margin-top:10px;font-size:14px;">${o.resume}</p>
            </div>
            <div class="card-actions">
              <button class="btn btn-secondary" onclick="ouvrirDetail(${o.id})">Voir plus de description</button>
              <button class="btn btn-primary" onclick="toggleOffre(${o.id})">${ajoutee ? "Retirer des offres" : "Ajouter aux offres"}</button>
            </div>
          </article>
        `;
      }).join("") || "<p>Aucune offre ne correspond à ta recherche.</p>";
    }

    function ouvrirDetail(id) {
      const o = offres.find(x => x.id === id);
      if (!o) return;
      const ajoutee = mesOffresIds.includes(o.id);
      document.getElementById("modal-contenu").innerHTML = `
        <h2>${o.titre}</h2>
        <div class="meta">${o.entreprise} — ${o.ville} • ${o.duree} • ${o.categorie}</div>
        <p><strong>Description complète :</strong> ${o.description}</p>
        <p><strong>Missions principales :</strong></p>
        <ul>${o.missions.map(m => `<li>${m}</li>`).join("")}</ul>
        <p><strong>Compétences recherchées :</strong></p>
        <ul>${o.competences.map(c => `<li>${c}</li>`).join("")}</ul>
        <div class="card-actions" style="margin-top:20px;">
          <button class="btn btn-primary" onclick="toggleOffre(${o.id}); ouvrirDetail(${o.id});">${ajoutee ? "Retirer des offres" : "Ajouter aux offres"}</button>
          <button class="btn btn-secondary" onclick="fermerModalDirect()">Fermer</button>
        </div>
      `;
      document.getElementById("modal-backdrop").classList.add("open");
    }

    function ouvrirMesOffres() {
      const selection = offres.filter(o => mesOffresIds.includes(o.id));
      document.getElementById("modal-contenu").innerHTML = `
        <h2>Mes Offres sélectionnées (${selection.length})</h2>
        ${selection.length ? selection.map(o => `
          <div style="margin-top:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.12);">
            <strong>${o.titre}</strong> <span class="meta">(${o.entreprise} — ${o.ville})</span>
            <p style="margin-top:6px;">${o.resume}</p>
            <div class="card-actions" style="margin-top:8px;">
              <button class="btn btn-secondary" onclick="ouvrirDetail(${o.id})">Description complète</button>
              <button class="btn btn-primary" onclick="toggleOffre(${o.id}); ouvrirMesOffres();">Retirer</button>
            </div>
          </div>
        `).join("") : "<p>Aucune offre ajoutée pour l'instant.</p>"}
        <div style="margin-top:18px;">
          <button class="btn btn-secondary" onclick="fermerModalDirect()">Fermer</button>
        </div>
      `;
      document.getElementById("modal-backdrop").classList.add("open");
    }

    function fermerModal(e) {
      if (e.target.id === "modal-backdrop") fermerModalDirect();
    }
    function fermerModalDirect() {
      document.getElementById("modal-backdrop").classList.remove("open");
    }

    function toggleAI() {
      document.getElementById("ai-box").classList.toggle("open");
    }

    function reponseAgentIA(question) {
      const q = question.toLowerCase();
      if (q.includes("cv") || q.includes("lettre") || q.includes("postuler")) {
        return "Pour postuler efficacement : mets en avant tes projets pratiques, tes compétences techniques et ta motivation pour l'entreprise, puis adapte ton message à chaque offre.";
      }
      if (q.includes("entretien")) {
        return "Prépare une présentation claire de 2 minutes sur ton parcours, explique pourquoi tu as choisi ce domaine et pose 2 questions concrètes sur les missions du stage.";
      }
      if (q.includes("offre") || q.includes("stage") || q.includes("tunis") || q.includes("sousse") || q.includes("sfax")) {
        return "Tu peux filtrer les offres par mot-clé ou catégorie en haut de la page, cliquer sur 'Voir plus de description' pour tout lire, et cliquer sur 'Ajouter aux offres' pour garder ta sélection.";
      }
      return "Je peux t'aider à choisir une offre, préparer ton CV ou ton entretien de stage. Précise ce que tu recherches !";
    }

    function envoyerMessageAI(e) {
      e.preventDefault();
      const input = document.getElementById("ai-input");
      const texte = input.value.trim();
      if (!texte) return;
      const box = document.getElementById("ai-messages");
      box.innerHTML += `<div class="msg user">${texte}</div>`;
      input.value = "";
      const rep = reponseAgentIA(texte);
      box.innerHTML += `<div class="msg bot">${rep}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    sauvegarderOffres();
    afficherOffres();
  </script>
</body>
</html>
